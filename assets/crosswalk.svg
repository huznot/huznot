<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 440 400" width="440" height="400" role="img" aria-label="icd crosswalk: an old diagnosis code is embedded and matched to its modern equivalent">
<style>
  svg{--paper:#ffffff;--grid:#eff2f5;--major:#dfe4ea;--rule:#d1d9e0;
      --ink:#1f2328;--ink2:#59636e;--pencil:#818b98;--margin:#f0cdb6;
      --accent:#bc4c00;--blue:#0969da;--green:#1a7f37;--purple:#8250df;
      --chip:#ffffff;--chipline:#d1d9e0;--bar:#59636e;--base:#8c959f;--wire:#d1d9e0}
  @media (prefers-color-scheme:dark){
    svg{--paper:#0d1117;--grid:#151b23;--major:#21262d;--rule:#30363d;
        --ink:#f0f6fc;--ink2:#9198a1;--pencil:#6e7681;--margin:#4a2f1d;
        --accent:#f0883e;--blue:#4493f8;--green:#3fb950;--purple:#ab7df8;
        --chip:#f6f8fa;--chipline:#30363d;--bar:#7d8590;--base:#6e7681;--wire:#30363d}
  }
  .paper{fill:var(--paper)}
  .gl{stroke:var(--grid);stroke-width:1}
  .gm{stroke:var(--major);stroke-width:1}
  .rl{stroke:var(--rule);stroke-width:1}
  .ml{stroke:var(--margin);stroke-width:1.3}
  .ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.pen{fill:var(--pencil)}
  .acc{fill:var(--accent)}.accs{stroke:var(--accent)}
  .blu{fill:var(--blue)}.grn{fill:var(--green)}.pur{fill:var(--purple)}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace}
  .hand{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive}
  @keyframes dr{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .u{fill:none;stroke:var(--accent);stroke-width:2}
  .d1{animation-delay:.35s}.d2{animation-delay:.5s}.d3{animation-delay:.65s}
  .d4{animation-delay:.8s}.d5{animation-delay:.95s}.d6{animation-delay:1.1s}

  /* every intro animation lives in here on purpose. an svg used as an image has
     its animations paused when the reader asks for reduced motion, and a paused
     animation never reaches its end state, so anything starting at opacity 0
     would just stay invisible. resting state is the finished state, motion is
     only ever added on top. note for later: this is a style block inside xml,
     so no angle brackets in here or the whole file stops parsing. */
  @media (prefers-reduced-motion:no-preference){
    .u{stroke-dasharray:260;stroke-dashoffset:260;animation:dr .9s ease-out .2s forwards}
    .rise{opacity:0;transform:translateY(6px);animation:rise .5s ease-out forwards}
  }

  .chip{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
  .chipa{fill:var(--paper);stroke:var(--accent);stroke-width:1.8}
  .modelbox{fill:var(--paper);stroke:var(--rule);stroke-width:1.3}
  .arrow{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round}
  .dot{fill:var(--pencil)}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-3px)}}
  @media (prefers-reduced-motion:no-preference){
    .v1{animation:drift 4s ease-in-out infinite}
    .v2{animation:drift 4s ease-in-out .6s infinite}
    .v3{animation:drift 4s ease-in-out 1.2s infinite}
  }
</style>

<defs>
  <pattern id="xf" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" class="gl" fill="none"/></pattern>
  <pattern id="xb" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" class="gm" fill="none"/></pattern>
</defs>
<rect class="paper" width="440" height="400" rx="6"/>
<rect width="440" height="400" fill="url(#xf)" rx="6"/>
<rect width="440" height="400" fill="url(#xb)" rx="6"/>

<rect x=".5" y=".5" width="439" height="399" rx="6" fill="none" class="rl"/>
<text x="26" y="32" class="mono ink" font-size="15" font-weight="700">icd crosswalk</text>
<path class="u" d="M26 40 H176"/>
<text x="392" y="32" class="mono pen" font-size="11">fig. 5</text>
<text x="26" y="56" class="mono ink2" font-size="10.5">matches retired diagnosis codes to current ones</text>

<rect x="140" y="76" width="160" height="36" rx="5" class="chip"/>
<text x="220" y="100" text-anchor="middle" class="mono ink" font-size="16" font-weight="700">250.00</text>
<text x="220" y="128" text-anchor="middle" class="mono pen" font-size="10">icd-9-cm, retired in 2015</text>
<path class="arrow" d="M220 142 v22"/><path class="arrow" d="M214 158 l6 6 l6 -6"/>

<rect x="86" y="180" width="268" height="88" rx="6" class="modelbox"/>
<text x="104" y="204" class="mono ink" font-size="12" font-weight="700">sapbert embeddings</text>
<g transform="translate(326,200)">
  <circle class="dot v1" cx="-8" cy="-7" r="2.6"/>
  <circle class="dot v2" cx="9" cy="-1" r="2.6"/>
  <circle class="dot v3" cx="-3" cy="9" r="2.6"/>
  <circle cx="1" cy="0" r="3.6" class="acc"/>
</g>
<text x="104" y="224" class="mono ink2" font-size="10.5">turns every code into a point in one</text>
<text x="104" y="238" class="mono ink2" font-size="10.5">space and picks the closest match</text>
<text x="104" y="258" class="mono pen" font-size="9.5">trained on the code text</text>
<path class="arrow" d="M220 284 v22"/><path class="arrow" d="M214 300 l6 6 l6 -6"/>

<rect x="140" y="322" width="160" height="36" rx="5" class="chipa"/>
<text x="220" y="346" text-anchor="middle" class="mono acc" font-size="16" font-weight="700">E11.9</text>
<text x="220" y="374" text-anchor="middle" class="mono ink2" font-size="10.5">icd-10-ca, type 2 diabetes</text>
<text x="220" y="390" text-anchor="middle" class="mono pen" font-size="9.5">a clinical coder does this by hand, one at a time</text>
</svg>
