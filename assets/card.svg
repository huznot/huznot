<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" width="440" height="400" role="img" aria-label="stack and tooling index card">
<style>
  svg{--paper:#f7f5ed;--grid:#d8e2ec;--major:#c2d2e0;--ink:#173a5e;--ink2:#4a6076;--pencil:#8a99a8;--margin:#d98b8b;--accent:#c0562f;--bar:#4a6076}
  @media (prefers-color-scheme:dark){
    svg{--paper:#0a2239;--grid:#12385c;--major:#1b4a75;--ink:#eaf4ff;--ink2:#a9c9e2;--pencil:#6f92ac;--margin:#3f7fb0;--accent:#f0a868;--bar:#7fb3d9}
  }
  .paper{fill:var(--paper)}.gl{stroke:var(--grid);stroke-width:1}.gm{stroke:var(--major);stroke-width:1}
  .ml{stroke:var(--margin);stroke-width:1.3}
  .ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.pen{fill:var(--pencil)}.acc{fill:var(--accent)}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace}
  .hand{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive}
  .bar{fill:var(--bar);opacity:.85}
  .track{fill:var(--major);opacity:.35}
  .tick{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
        stroke-dasharray:26;stroke-dashoffset:26;animation:dr .45s ease-out forwards}
  @keyframes dr{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  .row{opacity:0;animation:fade .45s ease-out forwards}
  .u{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:150;stroke-dashoffset:150;animation:dr 1.1s ease-out .3s forwards}
</style>
<defs>
  <pattern id="f2" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" class="gl" fill="none"/></pattern>
  <pattern id="b2" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" class="gm" fill="none"/></pattern>
</defs>
<rect class="paper" width="440" height="400"/>
<rect width="440" height="400" fill="url(#f2)"/><rect width="440" height="400" fill="url(#b2)"/>
<rect x="0" y="0" width="440" height="400" fill="none" class="gm" stroke-width="2"/>
<line x1="34" y1="0" x2="34" y2="400" class="ml"/>

<text x="46" y="34" class="mono ink" font-size="16" font-weight="700">stack &amp; tooling</text>
<path class="u" d="M46 42 H188"/>
<text x="336" y="34" class="mono pen" font-size="11">fig. 2</text>

<g class="row" style="animation-delay:.25s"><text x="46" y="70" class="mono ink2" font-size="13">typescript</text>
  <rect x="230" y="60" width="160" height="7" rx="3.5" class="track"/>
  <rect x="230" y="60" width="0" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="152" dur=".8s" begin=".3s" fill="freeze"/></rect></g>
<g class="row" style="animation-delay:.35s"><text x="46" y="96" class="mono ink2" font-size="13">react native · expo</text>
  <rect x="230" y="86" width="160" height="7" rx="3.5" class="track"/>
  <rect x="230" y="86" width="0" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="140" dur=".8s" begin=".4s" fill="freeze"/></rect></g>
<g class="row" style="animation-delay:.45s"><text x="46" y="122" class="mono ink2" font-size="13">javascript · html · css</text>
  <rect x="230" y="112" width="160" height="7" rx="3.5" class="track"/>
  <rect x="230" y="112" width="0" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="146" dur=".8s" begin=".5s" fill="freeze"/></rect></g>
<g class="row" style="animation-delay:.55s"><text x="46" y="148" class="mono ink2" font-size="13">python</text>
  <rect x="230" y="138" width="160" height="7" rx="3.5" class="track"/>
  <rect x="230" y="138" width="0" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="118" dur=".8s" begin=".6s" fill="freeze"/></rect></g>
<g class="row" style="animation-delay:.65s"><text x="46" y="174" class="mono ink2" font-size="13">r</text>
  <rect x="230" y="164" width="160" height="7" rx="3.5" class="track"/>
  <rect x="230" y="164" width="0" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="96" dur=".8s" begin=".7s" fill="freeze"/></rect></g>
<g class="row" style="animation-delay:.75s"><text x="46" y="200" class="mono ink2" font-size="13">php · mysql</text>
  <rect x="230" y="190" width="160" height="7" rx="3.5" class="track"/>
  <rect x="230" y="190" width="0" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="88" dur=".8s" begin=".8s" fill="freeze"/></rect></g>

<line x1="46" y1="222" x2="394" y2="222" class="gm" stroke-dasharray="4 4"/>
<text x="46" y="246" class="mono ink" font-size="13" font-weight="700">also on the bench</text>

<g class="row" style="animation-delay:.95s"><path class="tick" style="animation-delay:1.0s" d="M48 262 l5 6 l10 -13"/>
  <text x="72" y="266" class="mono ink2" font-size="12.5">leaflet · geospatial mapping</text></g>
<g class="row" style="animation-delay:1.05s"><path class="tick" style="animation-delay:1.1s" d="M48 286 l5 6 l10 -13"/>
  <text x="72" y="290" class="mono ink2" font-size="12.5">rest apis · live data pipelines</text></g>
<g class="row" style="animation-delay:1.15s"><path class="tick" style="animation-delay:1.2s" d="M48 310 l5 6 l10 -13"/>
  <text x="72" y="314" class="mono ink2" font-size="12.5">sentence embeddings · retrieval</text></g>
<g class="row" style="animation-delay:1.25s"><path class="tick" style="animation-delay:1.3s" d="M48 334 l5 6 l10 -13"/>
  <text x="72" y="338" class="mono ink2" font-size="12.5">retrospective model validation</text></g>

<g class="row" style="animation-delay:1.35s"><path class="tick" style="animation-delay:1.4s" d="M48 358 l5 6 l10 -13"/>
  <text x="72" y="362" class="mono ink2" font-size="12.5">game dev · browser and engine work</text></g>

<text x="232" y="388" class="hand pen" font-size="12.5">← the part i actually enjoy</text>
</svg>
