<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 440 400" width="440" height="400" role="img" aria-label="stack and tooling index card">
<style>
  svg{--paper:#ffffff;--grid:#eff2f5;--major:#dfe4ea;--rule:#d1d9e0;
      --ink:#1f2328;--ink2:#59636e;--pencil:#818b98;--margin:#f0cdb6;
      --accent:#bc4c00;--blue:#0969da;--green:#1a7f37;--purple:#8250df;
      --chip:#ffffff;--chipline:#d1d9e0;--bar:#59636e;--base:#8c959f;--wire:#d1d9e0}
  @media (prefers-color-scheme:dark){
    svg{--paper:#0d1117;--grid:#151b23;--major:#21262d;--rule:#30363d;
        --ink:#f0f6fc;--ink2:#9198a1;--pencil:#6e7681;--margin:#4a2f1d;
        --accent:#f0883e;--blue:#4493f8;--green:#3fb950;--purple:#ab7df8;
        --chip:#f6f8fa;--chipline:#30363d;--bar:#7d8590;--base:#6e7681;--wire:#30363d}
  }
  .paper{fill:var(--paper)}
  .gl{stroke:var(--grid);stroke-width:1}
  .gm{stroke:var(--major);stroke-width:1}
  .rl{stroke:var(--rule);stroke-width:1}
  .ml{stroke:var(--margin);stroke-width:1.3}
  .ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.pen{fill:var(--pencil)}
  .acc{fill:var(--accent)}.accs{stroke:var(--accent)}
  .blu{fill:var(--blue)}.grn{fill:var(--green)}.pur{fill:var(--purple)}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace}
  .hand{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive}
  @keyframes dr{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .u{fill:none;stroke:var(--accent);stroke-width:2}
  .d1{animation-delay:.35s}.d2{animation-delay:.5s}.d3{animation-delay:.65s}
  .d4{animation-delay:.8s}.d5{animation-delay:.95s}.d6{animation-delay:1.1s}

  /* every intro animation lives in here on purpose. an svg used as an image has
     its animations paused when the reader asks for reduced motion, and a paused
     animation never reaches its end state, so anything starting at opacity 0
     would just stay invisible. resting state is the finished state, motion is
     only ever added on top. note for later: this is a style block inside xml,
     so no angle brackets in here or the whole file stops parsing. */
  @media (prefers-reduced-motion:no-preference){
    .u{stroke-dasharray:260;stroke-dashoffset:260;animation:dr .9s ease-out .2s forwards}
    .rise{opacity:0;transform:translateY(6px);animation:rise .5s ease-out forwards}
  }

  .track2{fill:var(--major);opacity:.5}
  .bar{fill:var(--bar)}
  .tick{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  @media (prefers-reduced-motion:no-preference){
    .tick{stroke-dasharray:22;stroke-dashoffset:22;animation:dr .4s ease-out forwards}
  }
</style>

<defs>
  <pattern id="sf" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" class="gl" fill="none"/></pattern>
  <pattern id="sb" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" class="gm" fill="none"/></pattern>
</defs>
<rect class="paper" width="440" height="400" rx="6"/>
<rect width="440" height="400" fill="url(#sf)" rx="6"/>
<rect width="440" height="400" fill="url(#sb)" rx="6"/>
<line x1="34" y1="0" x2="34" y2="400" class="ml"/>
<rect x=".5" y=".5" width="439" height="399" rx="6" fill="none" class="rl"/>
<text x="46" y="34" class="mono ink" font-size="16" font-weight="700">stack &amp; tooling</text>
<path class="u" d="M46 42 H188"/>
<text x="336" y="34" class="mono pen" font-size="11">fig. 4</text>
<g class="rise" style="animation-delay:0.25s"><text x="46" y="70" class="mono ink2" font-size="12.5">c# · unity</text>
  <rect x="230" y="60" width="160" height="7" rx="3.5" class="track2"/>
  <rect x="230" y="60" width="156" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="156" dur=".8s" begin="0.30s" fill="freeze"/></rect></g>
<g class="rise" style="animation-delay:0.33s"><text x="46" y="95" class="mono ink2" font-size="12.5">typescript</text>
  <rect x="230" y="85" width="160" height="7" rx="3.5" class="track2"/>
  <rect x="230" y="85" width="152" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="152" dur=".8s" begin="0.38s" fill="freeze"/></rect></g>
<g class="rise" style="animation-delay:0.41s"><text x="46" y="120" class="mono ink2" font-size="12.5">react native · expo</text>
  <rect x="230" y="110" width="160" height="7" rx="3.5" class="track2"/>
  <rect x="230" y="110" width="140" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="140" dur=".8s" begin="0.46s" fill="freeze"/></rect></g>
<g class="rise" style="animation-delay:0.49s"><text x="46" y="145" class="mono ink2" font-size="12.5">javascript · html · css</text>
  <rect x="230" y="135" width="160" height="7" rx="3.5" class="track2"/>
  <rect x="230" y="135" width="146" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="146" dur=".8s" begin="0.54s" fill="freeze"/></rect></g>
<g class="rise" style="animation-delay:0.57s"><text x="46" y="170" class="mono ink2" font-size="12.5">python</text>
  <rect x="230" y="160" width="160" height="7" rx="3.5" class="track2"/>
  <rect x="230" y="160" width="118" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="118" dur=".8s" begin="0.62s" fill="freeze"/></rect></g>
<g class="rise" style="animation-delay:0.65s"><text x="46" y="195" class="mono ink2" font-size="12.5">r</text>
  <rect x="230" y="185" width="160" height="7" rx="3.5" class="track2"/>
  <rect x="230" y="185" width="96" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="96" dur=".8s" begin="0.70s" fill="freeze"/></rect></g>
<g class="rise" style="animation-delay:0.73s"><text x="46" y="220" class="mono ink2" font-size="12.5">php · mysql</text>
  <rect x="230" y="210" width="160" height="7" rx="3.5" class="track2"/>
  <rect x="230" y="210" width="88" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="88" dur=".8s" begin="0.78s" fill="freeze"/></rect></g>
<line x1="46" y1="252" x2="394" y2="252" class="gm" stroke-dasharray="4 4"/>
<text x="46" y="274" class="mono ink" font-size="13" font-weight="700">also on the bench</text>
<g class="rise" style="animation-delay:0.95s"><path class="tick" style="animation-delay:1.00s" d="M48 288 l5 6 l10 -13"/>
  <text x="72" y="292" class="mono ink2" font-size="12.5">leaflet · geospatial mapping</text></g>
<g class="rise" style="animation-delay:1.05s"><path class="tick" style="animation-delay:1.10s" d="M48 312 l5 6 l10 -13"/>
  <text x="72" y="316" class="mono ink2" font-size="12.5">rest apis · live data pipelines</text></g>
<g class="rise" style="animation-delay:1.15s"><path class="tick" style="animation-delay:1.20s" d="M48 336 l5 6 l10 -13"/>
  <text x="72" y="340" class="mono ink2" font-size="12.5">sentence embeddings · retrieval</text></g>
<g class="rise" style="animation-delay:1.25s"><path class="tick" style="animation-delay:1.30s" d="M48 360 l5 6 l10 -13"/>
  <text x="72" y="364" class="mono ink2" font-size="12.5">retrospective model validation</text></g>
<g class="rise" style="animation-delay:1.35s"><path class="tick" style="animation-delay:1.40s" d="M48 384 l5 6 l10 -13"/>
  <text x="72" y="388" class="mono ink2" font-size="12.5">shaders, physics and game feel</text></g>
</svg>
