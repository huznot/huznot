<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 264" width="900" height="264" role="img" aria-label="muhammad irfan - unity games, environmental data, applied ml">
<style>
  svg{--paper:#ffffff;--grid:#eff2f5;--major:#dfe4ea;--rule:#d1d9e0;
      --ink:#1f2328;--ink2:#59636e;--pencil:#818b98;--margin:#f0cdb6;
      --accent:#bc4c00;--blue:#0969da;--green:#1a7f37;--purple:#8250df;
      --chip:#ffffff;--chipline:#d1d9e0;--bar:#59636e;--base:#8c959f;--wire:#d1d9e0}
  @media (prefers-color-scheme:dark){
    svg{--paper:#0d1117;--grid:#151b23;--major:#21262d;--rule:#30363d;
        --ink:#f0f6fc;--ink2:#9198a1;--pencil:#6e7681;--margin:#4a2f1d;
        --accent:#f0883e;--blue:#4493f8;--green:#3fb950;--purple:#ab7df8;
        --chip:#f6f8fa;--chipline:#30363d;--bar:#7d8590;--base:#6e7681;--wire:#30363d}
  }
  .paper{fill:var(--paper)}
  .gl{stroke:var(--grid);stroke-width:1}
  .gm{stroke:var(--major);stroke-width:1}
  .rl{stroke:var(--rule);stroke-width:1}
  .ml{stroke:var(--margin);stroke-width:1.3}
  .ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.pen{fill:var(--pencil)}
  .acc{fill:var(--accent)}.accs{stroke:var(--accent)}
  .blu{fill:var(--blue)}.grn{fill:var(--green)}.pur{fill:var(--purple)}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace}
  .hand{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive}
  @keyframes dr{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .u{fill:none;stroke:var(--accent);stroke-width:2}
  .d1{animation-delay:.35s}.d2{animation-delay:.5s}.d3{animation-delay:.65s}
  .d4{animation-delay:.8s}.d5{animation-delay:.95s}.d6{animation-delay:1.1s}

  /* every intro animation lives in here on purpose. an svg used as an image has
     its animations paused when the reader asks for reduced motion, and a paused
     animation never reaches its end state, so anything starting at opacity 0
     would just stay invisible. resting state is the finished state, motion is
     only ever added on top. note for later: this is a style block inside xml,
     so no angle brackets in here or the whole file stops parsing. */
  @media (prefers-reduced-motion:no-preference){
    .u{stroke-dasharray:260;stroke-dashoffset:260;animation:dr .9s ease-out .2s forwards}
    .rise{opacity:0;transform:translateY(6px);animation:rise .5s ease-out forwards}
  }

  .draw{fill:none;stroke:none}
  .fillin{fill:var(--ink)}
  .caret{fill:var(--accent)}
  .trace{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}
  @keyframes beat{0%,100%{r:4;opacity:1}50%{r:6.5;opacity:.45}}
  @media (prefers-reduced-motion:no-preference){
    .draw{stroke:var(--ink);stroke-width:1.15;stroke-linejoin:round;
          stroke-dasharray:1400;stroke-dashoffset:1400;animation:dr 2.2s ease-out .15s forwards}
    .fillin{opacity:0;animation:fade 1s ease-out 1.5s forwards}
    .trace{stroke-dasharray:340;stroke-dashoffset:340;animation:dr 1.8s ease-out 1.2s forwards}
    .pulse{animation:beat 2.4s ease-in-out 3s infinite}
  }
</style>
<defs>
  <clipPath id="type"><rect x="92" y="152" width="420" height="24">
    <animate attributeName="width" from="0" to="420" dur="1.8s" begin="2.0s" fill="freeze"/>
  </rect></clipPath>
  <clipPath id="type2"><rect x="92" y="182" width="200" height="22">
    <animate attributeName="width" from="0" to="200" dur="1s" begin="3.6s" fill="freeze"/>
  </rect></clipPath>
</defs>

<defs>
  <pattern id="hf" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" class="gl" fill="none"/></pattern>
  <pattern id="hb" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" class="gm" fill="none"/></pattern>
</defs>
<rect class="paper" width="900" height="264" rx="6"/>
<rect width="900" height="264" fill="url(#hf)" rx="6"/>
<rect width="900" height="264" fill="url(#hb)" rx="6"/>
<line x1="72" y1="0" x2="72" y2="264" class="ml"/>
<rect x=".5" y=".5" width="899" height="263" rx="6" fill="none" class="rl"/>
<line x1="76" y1="0" x2="76" y2="264" class="ml" opacity=".45"/>

<text x="90" y="112" class="mono draw" font-size="52" font-weight="700" letter-spacing="-1">muhammad irfan</text>
<text x="90" y="112" class="mono fillin" font-size="52" font-weight="700" letter-spacing="-1">muhammad irfan</text>

<g clip-path="url(#type)">
  <text x="92" y="169" class="mono ink2" font-size="17">unity games &#183; environmental data &#183; applied ml</text>
</g>
<rect x="92" y="152" width="9" height="20" class="caret" opacity="0">
  <animate attributeName="x" from="92" to="516" dur="1.8s" begin="2.0s" fill="freeze"/>
  <set attributeName="opacity" to="1" begin="2.0s"/>
</rect>
<g clip-path="url(#type2)">
  <text x="92" y="199" class="mono pen" font-size="13.5">winnipeg, manitoba</text>
</g>

<text x="700" y="34" class="mono pen rise d4" font-size="11.5">fig. 1 &#183; subject profile</text>
<text x="700" y="50" class="mono pen rise d4" font-size="11.5">rev. 2026.09 &#183; sheet 1/1</text>
<line x1="695" y1="58" x2="866" y2="58" class="gm" stroke-width="1.2"/>

<g transform="translate(636,96)">
  <line x1="0" y1="0" x2="0" y2="96" class="gm" stroke-width="1.3"/>
  <line x1="0" y1="96" x2="222" y2="96" class="gm" stroke-width="1.3"/>
  <path class="trace" d="M4 88 L34 82 L64 70 L94 66 L124 44 L154 36 L184 18 L214 10"/>
  <circle cx="214" cy="10" r="4" class="acc pulse"/>
  <text x="6" y="-8" class="hand pen rise d1" font-size="12.5">things shipped over time</text>
  <text x="112" y="115" class="mono pen rise d2" font-size="10.5">2023 &#183; &#183; &#183; &#183; &#183; &#183; 2026</text>
</g>

<g class="rise d2"><rect x="90" y="220" width="96" height="24" rx="4" fill="none" class="gm" stroke-width="1.3"/><text x="101" y="236" class="mono ink2" font-size="11.5">cmos award</text></g>
<g class="rise d3"><rect x="198" y="220" width="140" height="24" rx="4" fill="none" class="gm" stroke-width="1.3"/><text x="209" y="236" class="mono ink2" font-size="11.5">mss silver medal</text></g>
<g class="rise d4"><rect x="350.4" y="220" width="163" height="24" rx="4" fill="none" class="gm" stroke-width="1.3"/><text x="361.4" y="236" class="mono ink2" font-size="11.5">cybertitan finalist</text></g>
<g class="rise d5"><rect x="525" y="220" width="96" height="24" rx="4" fill="none" class="gm" stroke-width="1.3"/><text x="536" y="236" class="mono ink2" font-size="11.5">ingenious+</text></g>
<g class="rise d6"><rect x="633" y="220" width="118" height="24" rx="4" fill="none" class="accs" stroke-width="1.3"/><text x="644" y="236" class="mono acc" font-size="11.5">$3.5k+ funded</text></g>
</svg>
