<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 292" width="440" height="292" role="img" aria-label="865 contributions total, 2 day current streak, 6 day longest streak">
<style>
  svg{--paper:#ffffff;--grid:#eff2f5;--major:#dfe4ea;--rule:#d1d9e0;
      --ink:#1f2328;--ink2:#59636e;--pencil:#818b98;--margin:#f0cdb6;
      --accent:#bc4c00;--blue:#0969da;--green:#1a7f37;--purple:#8250df;
      --chip:#ffffff;--chipline:#d1d9e0;--bar:#59636e;--base:#8c959f;--wire:#d1d9e0;
      --mark-filter:none;--mark-opacity:.72}
  @media (prefers-color-scheme:dark){
    svg{--paper:#0d1117;--grid:#151b23;--major:#21262d;--rule:#30363d;
        --ink:#f0f6fc;--ink2:#9198a1;--pencil:#6e7681;--margin:#4a2f1d;
        --accent:#f0883e;--blue:#4493f8;--green:#3fb950;--purple:#ab7df8;
        --chip:#f6f8fa;--chipline:#30363d;--bar:#7d8590;--base:#6e7681;--wire:#30363d;
        --mark-filter:invert(1);--mark-opacity:.8}
  }
  /* anything that has to change with the theme belongs in the two palette blocks
     above, even when it is not a colour. writePlate builds the dark file by
     pinning that block on, so a rule left sitting inside the media query alone
     never fires for the readers who get the dark file, which is every reader on
     github mobile. --mark-filter is why the carousel logos are inverted. */
  .paper{fill:var(--paper)}
  .gl{stroke:var(--grid);stroke-width:1}
  .gm{stroke:var(--major);stroke-width:1}
  .rl{stroke:var(--rule);stroke-width:1}
  .ml{stroke:var(--margin);stroke-width:1.3}
  .ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.pen{fill:var(--pencil)}
  .acc{fill:var(--accent)}.accs{stroke:var(--accent)}
  .blu{fill:var(--blue)}.grn{fill:var(--green)}.pur{fill:var(--purple)}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace}
  .hand{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive}
  @keyframes dr{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  .u{fill:none;stroke:var(--accent);stroke-width:2}

  /* nothing on these plates is allowed to start invisible and animate itself in.
     an svg used as an image reports prefers-reduced-motion as no-preference and
     then declines to run the animation anyway, on github mobile and on any
     machine with animations turned off, which leaves that content hidden for
     good. so intro animations are gone and only looping decoration is left,
     since a paused loop just sits on its first frame and still looks right. */
          .rtrack{fill:none;stroke:var(--major);stroke-width:6}
          .ring{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round}svg{--paper:#0d1117;--grid:#151b23;--major:#21262d;--rule:#30363d;
        --ink:#f0f6fc;--ink2:#9198a1;--pencil:#6e7681;--margin:#4a2f1d;
        --accent:#f0883e;--blue:#4493f8;--green:#3fb950;--purple:#ab7df8;
        --chip:#f6f8fa;--chipline:#30363d;--bar:#7d8590;--base:#6e7681;--wire:#30363d;
        --mark-filter:invert(1);--mark-opacity:.8}</style>

<defs>
  <pattern id="kf" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" class="gl" fill="none"/></pattern>
  <pattern id="kb" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" class="gm" fill="none"/></pattern>
</defs>
<rect class="paper" width="440" height="292" rx="6"/>
<rect width="440" height="292" fill="url(#kf)" rx="6"/>
<rect width="440" height="292" fill="url(#kb)" rx="6"/>

<rect x=".5" y=".5" width="439" height="291" rx="6" fill="none" class="rl"/>
<text x="26" y="32" class="mono ink" font-size="15" font-weight="700">still showing up</text>
<path class="u" d="M26 40 H228"/>
<text x="392" y="32" class="mono pen" font-size="11">fig. 8</text>

<line x1="152" y1="66" x2="152" y2="228" class="gm"/>
<line x1="288" y1="66" x2="288" y2="228" class="gm"/>

<text x="88" y="130" text-anchor="middle" class="mono ink" font-size="30" font-weight="700">865</text>
<text x="88" y="156" text-anchor="middle" class="mono ink2" font-size="11">contributions</text>
<text x="88" y="174" text-anchor="middle" class="mono pen" font-size="9.5">since feb 28 23</text>

<g transform="translate(220,120)">
  <circle class="rtrack" r="40"/>
  <circle class="ring" r="40" transform="rotate(-90)"
    stroke-dasharray="83.8 251.3"/>
</g>
<text x="220" y="128" text-anchor="middle" class="mono acc" font-size="30" font-weight="700">2</text>
<text x="220" y="192" text-anchor="middle" class="mono acc" font-size="11" font-weight="700">current streak</text>
<text x="220" y="209" text-anchor="middle" class="mono pen" font-size="9.5">sep 7 26 &#8594; now</text>

<text x="352" y="130" text-anchor="middle" class="mono ink" font-size="30" font-weight="700">6</text>
<text x="352" y="156" text-anchor="middle" class="mono ink2" font-size="11">longest streak</text>
<text x="352" y="174" text-anchor="middle" class="mono pen" font-size="9.5">jan 14 26 &#8211; jan 19 26</text>

<line x1="26" y1="250" x2="414" y2="250" class="gm" stroke-dasharray="4 4"/>
<text x="26" y="272" class="hand pen" font-size="11.5">counted 2026-09-09</text>
</svg>
