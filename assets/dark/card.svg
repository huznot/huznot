<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="what i build with">
<style>
  svg{--paper:#ffffff;--grid:#eff2f5;--major:#dfe4ea;--rule:#d1d9e0;
      --ink:#1f2328;--ink2:#59636e;--pencil:#818b98;--margin:#f0cdb6;
      --accent:#bc4c00;--blue:#0969da;--green:#1a7f37;--purple:#8250df;
      --chip:#ffffff;--chipline:#d1d9e0;--bar:#59636e;--base:#8c959f;--wire:#d1d9e0;
      --mark-filter:none;--mark-opacity:.72}
  @media (prefers-color-scheme:dark){
    svg{--paper:#0d1117;--grid:#151b23;--major:#21262d;--rule:#30363d;
        --ink:#f0f6fc;--ink2:#9198a1;--pencil:#6e7681;--margin:#4a2f1d;
        --accent:#f0883e;--blue:#4493f8;--green:#3fb950;--purple:#ab7df8;
        --chip:#f6f8fa;--chipline:#30363d;--bar:#7d8590;--base:#6e7681;--wire:#30363d;
        --mark-filter:invert(1);--mark-opacity:.8}
  }
  /* anything that has to change with the theme belongs in the two palette blocks
     above, even when it is not a colour. writePlate builds the dark file by
     pinning that block on, so a rule left sitting inside the media query alone
     never fires for the readers who get the dark file, which is every reader on
     github mobile. --mark-filter is why the carousel logos are inverted. */
  .paper{fill:var(--paper)}
  .gl{stroke:var(--grid);stroke-width:1}
  .gm{stroke:var(--major);stroke-width:1}
  .rl{stroke:var(--rule);stroke-width:1}
  .ml{stroke:var(--margin);stroke-width:1.3}
  .ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.pen{fill:var(--pencil)}
  .acc{fill:var(--accent)}.accs{stroke:var(--accent)}
  .blu{fill:var(--blue)}.grn{fill:var(--green)}.pur{fill:var(--purple)}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace}
  .hand{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive}
  @keyframes dr{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  .u{fill:none;stroke:var(--accent);stroke-width:2}

  /* nothing on these plates is allowed to start invisible and animate itself in.
     an svg used as an image reports prefers-reduced-motion as no-preference and
     then declines to run the animation anyway, on github mobile and on any
     machine with animations turned off, which leaves that content hidden for
     good. so intro animations are gone and only looping decoration is left,
     since a paused loop just sits on its first frame and still looks right. */

  .track2{fill:var(--major);opacity:.5}
  .bar{fill:var(--bar)}
  .tick{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg{--paper:#0d1117;--grid:#151b23;--major:#21262d;--rule:#30363d;
        --ink:#f0f6fc;--ink2:#9198a1;--pencil:#6e7681;--margin:#4a2f1d;
        --accent:#f0883e;--blue:#4493f8;--green:#3fb950;--purple:#ab7df8;
        --chip:#f6f8fa;--chipline:#30363d;--bar:#7d8590;--base:#6e7681;--wire:#30363d;
        --mark-filter:invert(1);--mark-opacity:.8}</style>

<defs>
  <pattern id="sf" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" class="gl" fill="none"/></pattern>
  <pattern id="sb" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" class="gm" fill="none"/></pattern>
</defs>
<rect class="paper" width="900" height="240" rx="6"/>
<rect width="900" height="240" fill="url(#sf)" rx="6"/>
<rect width="900" height="240" fill="url(#sb)" rx="6"/>
<line x1="34" y1="0" x2="34" y2="240" class="ml"/>
<rect x=".5" y=".5" width="899" height="239" rx="6" fill="none" class="rl"/>
<text x="46" y="34" class="mono ink" font-size="16" font-weight="700">what i build with</text>
<path class="u" d="M46 42 H236"/>
<text x="838" y="34" class="mono pen" font-size="11">fig. 4</text>
<text x="46" y="58" class="mono ink2" font-size="11.5">everything on this page</text>
<g><text x="46" y="82" class="mono ink2" font-size="12">c# · unity</text>
  <rect x="212" y="73" width="190" height="7" rx="3.5" class="track2"/>
  <rect x="212" y="73" width="190.0" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="190.0" dur=".8s" begin="0.30s" fill="freeze"/></rect></g><g><text x="46" y="104" class="mono ink2" font-size="12">typescript</text>
  <rect x="212" y="95" width="190" height="7" rx="3.5" class="track2"/>
  <rect x="212" y="95" width="184.3" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="184.3" dur=".8s" begin="0.37s" fill="freeze"/></rect></g><g><text x="46" y="126" class="mono ink2" font-size="12">react native · expo</text>
  <rect x="212" y="117" width="190" height="7" rx="3.5" class="track2"/>
  <rect x="212" y="117" width="171.0" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="171.0" dur=".8s" begin="0.44s" fill="freeze"/></rect></g><g><text x="46" y="148" class="mono ink2" font-size="12">javascript · html · css</text>
  <rect x="212" y="139" width="190" height="7" rx="3.5" class="track2"/>
  <rect x="212" y="139" width="178.6" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="178.6" dur=".8s" begin="0.51s" fill="freeze"/></rect></g><g><text x="46" y="170" class="mono ink2" font-size="12">python</text>
  <rect x="212" y="161" width="190" height="7" rx="3.5" class="track2"/>
  <rect x="212" y="161" width="144.4" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="144.4" dur=".8s" begin="0.58s" fill="freeze"/></rect></g><g><text x="46" y="192" class="mono ink2" font-size="12">r</text>
  <rect x="212" y="183" width="190" height="7" rx="3.5" class="track2"/>
  <rect x="212" y="183" width="117.8" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="117.8" dur=".8s" begin="0.65s" fill="freeze"/></rect></g><g><text x="46" y="214" class="mono ink2" font-size="12">php · mysql</text>
  <rect x="212" y="205" width="190" height="7" rx="3.5" class="track2"/>
  <rect x="212" y="205" width="106.4" height="7" rx="3.5" class="bar"><animate attributeName="width" from="0" to="106.4" dur=".8s" begin="0.72s" fill="freeze"/></rect></g>
<line x1="440" y1="70" x2="440" y2="212" class="gm"/>
<text x="470" y="82" class="mono ink" font-size="13" font-weight="700">also on the bench</text>
<g><path class="tick" d="M474 100 l5 6 l10 -13"/>
  <text x="498" y="104" class="mono ink2" font-size="12.5">leaflet · geospatial mapping</text></g><g><path class="tick" d="M474 124 l5 6 l10 -13"/>
  <text x="498" y="128" class="mono ink2" font-size="12.5">rest apis · live data pipelines</text></g><g><path class="tick" d="M474 148 l5 6 l10 -13"/>
  <text x="498" y="152" class="mono ink2" font-size="12.5">sentence embeddings · retrieval</text></g><g><path class="tick" d="M474 172 l5 6 l10 -13"/>
  <text x="498" y="176" class="mono ink2" font-size="12.5">retrospective model validation</text></g><g><path class="tick" d="M474 196 l5 6 l10 -13"/>
  <text x="498" y="200" class="mono ink2" font-size="12.5">shaders, physics and game feel</text></g>
</svg>
