<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 286" width="900" height="286" role="img" aria-label="four unity games: let there be light, 1v1 basketball, museum, dynamics sandbox">
<style>
  svg{--paper:#ffffff;--grid:#eff2f5;--major:#dfe4ea;--rule:#d1d9e0;
      --ink:#1f2328;--ink2:#59636e;--pencil:#818b98;--margin:#f0cdb6;
      --accent:#bc4c00;--blue:#0969da;--green:#1a7f37;--purple:#8250df;
      --chip:#ffffff;--chipline:#d1d9e0;--bar:#59636e;--base:#8c959f;--wire:#d1d9e0}
  @media (prefers-color-scheme:dark){
    svg{--paper:#0d1117;--grid:#151b23;--major:#21262d;--rule:#30363d;
        --ink:#f0f6fc;--ink2:#9198a1;--pencil:#6e7681;--margin:#4a2f1d;
        --accent:#f0883e;--blue:#4493f8;--green:#3fb950;--purple:#ab7df8;
        --chip:#f6f8fa;--chipline:#30363d;--bar:#7d8590;--base:#6e7681;--wire:#30363d}
  }
  .paper{fill:var(--paper)}
  .gl{stroke:var(--grid);stroke-width:1}
  .gm{stroke:var(--major);stroke-width:1}
  .rl{stroke:var(--rule);stroke-width:1}
  .ml{stroke:var(--margin);stroke-width:1.3}
  .ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.pen{fill:var(--pencil)}
  .acc{fill:var(--accent)}.accs{stroke:var(--accent)}
  .blu{fill:var(--blue)}.grn{fill:var(--green)}.pur{fill:var(--purple)}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace}
  .hand{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive}
  @keyframes dr{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  .u{fill:none;stroke:var(--accent);stroke-width:2}

  /* nothing on these plates is allowed to start invisible and animate itself in.
     an svg used as an image reports prefers-reduced-motion as no-preference and
     then declines to run the animation anyway, on github mobile and on any
     machine with animations turned off, which leaves that content hidden for
     good. so intro animations are gone and only looping decoration is left,
     since a paused loop just sits on its first frame and still looks right. */

  .panel{fill:none;stroke:var(--rule);stroke-width:1.2}
  .well{fill:var(--major);opacity:.9}
  .glow{animation:flick 5.2s ease-in-out infinite}
  .bulb{animation:bulb 5.2s ease-in-out infinite}
  .net{transform-origin:center top;animation:swish 3.2s ease-out infinite}
  .spot{animation:sweep 6s ease-in-out infinite}
  .vec{transform-origin:0 0;animation:swing 3.4s ease-in-out infinite}
  .cursor{animation:blink 1.1s steps(1) infinite}
  @keyframes flick{0%,100%{opacity:.20}8%{opacity:.85}14%{opacity:.35}22%{opacity:.95}
                   40%{opacity:.6}58%{opacity:.98}72%{opacity:.5}88%{opacity:.9}}
  @keyframes bulb{0%,100%{opacity:.5}22%{opacity:1}58%{opacity:1}72%{opacity:.6}}
  @keyframes swish{0%,72%{transform:scaleY(1)}80%{transform:scaleY(1.7)}100%{transform:scaleY(1)}}
  @keyframes sweep{0%{transform:translateX(0)}45%{transform:translateX(104px)}
                   55%{transform:translateX(104px)}100%{transform:translateX(0)}}
  @keyframes swing{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(26deg)}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
svg{--paper:#0d1117;--grid:#151b23;--major:#21262d;--rule:#30363d;
        --ink:#f0f6fc;--ink2:#9198a1;--pencil:#6e7681;--margin:#4a2f1d;
        --accent:#f0883e;--blue:#4493f8;--green:#3fb950;--purple:#ab7df8;
        --chip:#f6f8fa;--chipline:#30363d;--bar:#7d8590;--base:#6e7681;--wire:#30363d}</style>

<defs>
  <pattern id="gf" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" class="gl" fill="none"/></pattern>
  <pattern id="gb" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" class="gm" fill="none"/></pattern>
</defs>
<rect class="paper" width="900" height="286" rx="6"/>
<rect width="900" height="286" fill="url(#gf)" rx="6"/>
<rect width="900" height="286" fill="url(#gb)" rx="6"/>
<line x1="34" y1="0" x2="34" y2="286" class="ml"/>
<rect x=".5" y=".5" width="899" height="285" rx="6" fill="none" class="rl"/>
<text x="46" y="34" class="mono ink" font-size="16" font-weight="700">games, made in unity</text>
<path class="u" d="M46 42 H262"/>
<text x="800" y="34" class="mono pen" font-size="11">fig. 2 &#183; plate a</text>
<text x="46" y="56" class="mono ink2" font-size="11.5">c# &#183; unity 6000.2 and 2022.3 &#183; windows builds, museum runs in the browser</text>
<g >
  <rect x="44" y="66" width="189" height="184" rx="6" class="panel"/>
  <g transform="translate(58,80)"><defs><radialGradient id="lamp">
        <stop offset="0" stop-color="var(--accent)" stop-opacity=".5"/>
        <stop offset=".5" stop-color="var(--accent)" stop-opacity=".16"/>
        <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></radialGradient></defs>
      <circle class="glow" cx="80" cy="44" r="46" fill="url(#lamp)"/>
      <line x1="80" y1="0" x2="80" y2="28" class="gm" stroke-width="1.3"/>
      <circle cx="80" cy="43" r="15" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/>
      <rect x="73" y="55" width="14" height="9" rx="1.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/>
      <path class="bulb" d="M75 46 l4 -8 l3 8 l3 -8" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round"/>
      <ellipse class="glow" cx="80" cy="86" rx="44" ry="5" fill="var(--accent)" opacity=".25"/>
      <line x1="24" y1="86" x2="138" y2="86" class="gm" stroke-width="1.3"/></g>
  <text x="58" y="196" class="mono ink" font-size="13.5" font-weight="700">let there be light</text>
  <text x="58" y="214" class="mono ink2" font-size="10.5">first person story game,</text>
  <text x="58" y="228" class="mono ink2" font-size="10.5">three acts, one flashback</text>
  <text x="58" y="243" class="mono pen" font-size="9">huznot/Let-There-Be-Light</text>
</g>
<g >
  <rect x="251" y="66" width="189" height="184" rx="6" class="panel"/>
  <g transform="translate(265,80)"><path d="M40 82 Q84 6 128 54" fill="none" stroke="var(--major)" stroke-width="1.2" stroke-dasharray="3 5"/>
      <line x1="128" y1="26" x2="128" y2="54" class="gm" stroke-width="1.6"/>
      <line x1="112" y1="54" x2="140" y2="54" class="accs" stroke-width="2.4"/>
      <path class="net" d="M114 54 l4 12 h16 l4 -12" fill="none" stroke="var(--pencil)" stroke-width="1.1"/>
      <circle cx="84" cy="26" r="8" fill="var(--accent)">
        <animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;0.75"
          calcMode="linear" path="M-44 56 Q0 -20 44 28"/>
        <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite"
          values="1;1;0;0" keyTimes="0;0.76;0.86;1"/>
      </circle>
      <line x1="30" y1="86" x2="146" y2="86" class="gm" stroke-width="1.3"/></g>
  <text x="265" y="196" class="mono ink" font-size="13.5" font-weight="700">1v1 basketball</text>
  <text x="265" y="214" class="mono ink2" font-size="10.5">two players, one keyboard</text>
  <text x="265" y="228" class="mono ink2" font-size="10.5">first to 10 takes it</text>
  <text x="265" y="243" class="mono pen" font-size="9">huznot/1v1-Basketball</text>
</g>
<g >
  <rect x="458" y="66" width="189" height="184" rx="6" class="panel"/>
  <g transform="translate(472,80)"><g>
        <rect x="26" y="26" width="34" height="42" rx="2" fill="none" class="rl"/>
        <rect x="72" y="26" width="34" height="42" rx="2" fill="none" class="rl"/>
        <rect x="118" y="26" width="34" height="42" rx="2" fill="none" class="rl"/>
        <rect x="30" y="30" width="26" height="34" class="well"/>
        <rect x="76" y="30" width="26" height="34" class="well"/>
        <rect x="122" y="30" width="26" height="34" class="well"/>
      </g>
      <g class="spot"><rect x="24" y="22" width="50" height="50" rx="3" fill="var(--accent)" opacity=".22"/></g>
      <line x1="20" y1="86" x2="158" y2="86" class="gm" stroke-width="1.3"/>
      <circle cx="34" cy="80" r="4" class="pen"/></g>
  <text x="472" y="196" class="mono ink" font-size="13.5" font-weight="700">museum</text>
  <text x="472" y="214" class="mono ink2" font-size="10.5">a black history museum,</text>
  <text x="472" y="228" class="mono ink2" font-size="10.5">narrated room by room</text>
  <text x="472" y="243" class="mono pen" font-size="9">huznot/Museum-Game</text>
</g>
<g >
  <rect x="665" y="66" width="189" height="184" rx="6" class="panel"/>
  <g transform="translate(679,80)"><line x1="26" y1="86" x2="158" y2="86" class="gm" stroke-width="1.3"/>
      <g transform="translate(64,62)">
        <g class="vec">
          <line x1="0" y1="0" x2="0" y2="-52" class="accs" stroke-width="2.4"/>
          <path d="M-5 -46 L0 -56 L5 -46 z" class="acc"/>
        </g>
        <circle cx="0" cy="0" r="6" class="ink"/>
      </g>
      <text x="98" y="34" class="mono ink2" font-size="10">v  4.21 m/s</text>
      <text x="98" y="48" class="mono ink2" font-size="10">a  1.06 m/s&#178;</text>
      <text x="98" y="62" class="mono acc" font-size="10">F  84.9 N</text>
      <rect x="150" y="55" width="5" height="9" class="acc cursor"/></g>
  <text x="679" y="196" class="mono ink" font-size="13.5" font-weight="700">dynamics sandbox</text>
  <text x="679" y="214" class="mono ink2" font-size="10.5">velocity, acceleration</text>
  <text x="679" y="228" class="mono ink2" font-size="10.5">and force, updating live</text>
  <text x="679" y="243" class="mono pen" font-size="9">huznot/physics-sandbox</text>
</g>
</svg>
