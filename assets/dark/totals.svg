<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 96" width="900" height="96" role="img" aria-label="52 repos, 204 commits, 6 pull requests, 2 stars, 859 contributions">
<style>
  svg{--paper:#ffffff;--grid:#eff2f5;--major:#dfe4ea;--rule:#d1d9e0;
      --ink:#1f2328;--ink2:#59636e;--pencil:#818b98;--margin:#f0cdb6;
      --accent:#bc4c00;--blue:#0969da;--green:#1a7f37;--purple:#8250df;
      --chip:#ffffff;--chipline:#d1d9e0;--bar:#59636e;--base:#8c959f;--wire:#d1d9e0}
  @media (prefers-color-scheme:dark){
    svg{--paper:#0d1117;--grid:#151b23;--major:#21262d;--rule:#30363d;
        --ink:#f0f6fc;--ink2:#9198a1;--pencil:#6e7681;--margin:#4a2f1d;
        --accent:#f0883e;--blue:#4493f8;--green:#3fb950;--purple:#ab7df8;
        --chip:#f6f8fa;--chipline:#30363d;--bar:#7d8590;--base:#6e7681;--wire:#30363d}
  }
  .paper{fill:var(--paper)}
  .gl{stroke:var(--grid);stroke-width:1}
  .gm{stroke:var(--major);stroke-width:1}
  .rl{stroke:var(--rule);stroke-width:1}
  .ml{stroke:var(--margin);stroke-width:1.3}
  .ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.pen{fill:var(--pencil)}
  .acc{fill:var(--accent)}.accs{stroke:var(--accent)}
  .blu{fill:var(--blue)}.grn{fill:var(--green)}.pur{fill:var(--purple)}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace}
  .hand{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive}
  @keyframes dr{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  .u{fill:none;stroke:var(--accent);stroke-width:2}

  /* nothing on these plates is allowed to start invisible and animate itself in.
     an svg used as an image reports prefers-reduced-motion as no-preference and
     then declines to run the animation anyway, on github mobile and on any
     machine with animations turned off, which leaves that content hidden for
     good. so intro animations are gone and only looping decoration is left,
     since a paused loop just sits on its first frame and still looks right. */
svg{--paper:#0d1117;--grid:#151b23;--major:#21262d;--rule:#30363d;
        --ink:#f0f6fc;--ink2:#9198a1;--pencil:#6e7681;--margin:#4a2f1d;
        --accent:#f0883e;--blue:#4493f8;--green:#3fb950;--purple:#ab7df8;
        --chip:#f6f8fa;--chipline:#30363d;--bar:#7d8590;--base:#6e7681;--wire:#30363d}</style>

<defs>
  <pattern id="tf" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" class="gl" fill="none"/></pattern>
  <pattern id="tb" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" class="gm" fill="none"/></pattern>
</defs>
<rect class="paper" width="900" height="96" rx="6"/>
<rect width="900" height="96" fill="url(#tf)" rx="6"/>
<rect width="900" height="96" fill="url(#tb)" rx="6"/>
<line x1="34" y1="0" x2="34" y2="96" class="ml"/>
<rect x=".5" y=".5" width="899" height="95" rx="6" fill="none" class="rl"/>
<text x="138.8" y="56" text-anchor="middle" class="mono ink" font-size="26" font-weight="700">52</text>
<text x="138.8" y="76" text-anchor="middle" class="mono pen" font-size="10.5">repos</text>

<text x="300.4" y="56" text-anchor="middle" class="mono ink" font-size="26" font-weight="700">204</text>
<text x="300.4" y="76" text-anchor="middle" class="mono pen" font-size="10.5">commits</text>
<line x1="219.6" y1="26" x2="219.6" y2="76" class="gm"/>
<text x="462" y="56" text-anchor="middle" class="mono ink" font-size="26" font-weight="700">6</text>
<text x="462" y="76" text-anchor="middle" class="mono pen" font-size="10.5">pull requests</text>
<line x1="381.2" y1="26" x2="381.2" y2="76" class="gm"/>
<text x="623.5999999999999" y="56" text-anchor="middle" class="mono ink" font-size="26" font-weight="700">2</text>
<text x="623.5999999999999" y="76" text-anchor="middle" class="mono pen" font-size="10.5">stars</text>
<line x1="542.8" y1="26" x2="542.8" y2="76" class="gm"/>
<text x="785.1999999999999" y="56" text-anchor="middle" class="mono ink" font-size="26" font-weight="700">859</text>
<text x="785.1999999999999" y="76" text-anchor="middle" class="mono pen" font-size="10.5">contributions</text>
<line x1="704.4" y1="26" x2="704.4" y2="76" class="gm"/>
</svg>
