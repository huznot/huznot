<text x="394" y="114" text-anchor="end" class="mono pen" font-size="10.5">6.9%</text>
<text x="46" y="140" class="mono ink2" font-size="12">shaderlab</text>
<rect x="176" y="132" width="200" height="8" rx="4" fill="var(--major)" fill-opacity=".7"/>
<rect x="176" y="132" width="9.6" height="8" rx="4" fill="var(--accent)" fill-opacity=".9"><animate attributeName="width" from="0" to="9.6" dur=".9s" begin="0.50s" fill="freeze"/></rect>
<text x="394" y="140" text-anchor="end" class="mono pen" font-size="10.5">4.8%</text>
<text x="46" y="166" class="mono ink2" font-size="12">r</text>
