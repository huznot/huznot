<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 292" width="440" height="292" role="img" aria-label="language distribution across public repositories">
<style>
  svg{--paper:#ffffff;--grid:#eff2f5;--major:#dfe4ea;--rule:#d1d9e0;
      --ink:#1f2328;--ink2:#59636e;--pencil:#818b98;--margin:#f0cdb6;
      --accent:#bc4c00;--blue:#0969da;--green:#1a7f37;--purple:#8250df;
      --chip:#ffffff;--chipline:#d1d9e0;--bar:#59636e;--base:#8c959f;--wire:#d1d9e0;
      --mark-filter:none;--mark-opacity:.72}
  @media (prefers-color-scheme:dark){
    svg{--paper:#0d1117;--grid:#151b23;--major:#21262d;--rule:#30363d;
        --ink:#f0f6fc;--ink2:#9198a1;--pencil:#6e7681;--margin:#4a2f1d;
        --accent:#f0883e;--blue:#4493f8;--green:#3fb950;--purple:#ab7df8;
        --chip:#f6f8fa;--chipline:#30363d;--bar:#7d8590;--base:#6e7681;--wire:#30363d;
        --mark-filter:invert(1);--mark-opacity:.8}
  }
  /* anything that has to change with the theme belongs in the two palette blocks
     above, even when it is not a colour. writePlate builds the dark file by
     pinning that block on, so a rule left sitting inside the media query alone
     never fires for the readers who get the dark file, which is every reader on
     github mobile. --mark-filter is why the carousel logos are inverted. */
  .paper{fill:var(--paper)}
  .gl{stroke:var(--grid);stroke-width:1}
  .gm{stroke:var(--major);stroke-width:1}
  .rl{stroke:var(--rule);stroke-width:1}
  .ml{stroke:var(--margin);stroke-width:1.3}
  .ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.pen{fill:var(--pencil)}
  .acc{fill:var(--accent)}.accs{stroke:var(--accent)}
  .blu{fill:var(--blue)}.grn{fill:var(--green)}.pur{fill:var(--purple)}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace}
  .hand{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive}
  @keyframes dr{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  .u{fill:none;stroke:var(--accent);stroke-width:2}

  /* nothing on these plates is allowed to start invisible and animate itself in.
     an svg used as an image reports prefers-reduced-motion as no-preference and
     then declines to run the animation anyway, on github mobile and on any
     machine with animations turned off, which leaves that content hidden for
     good. so intro animations are gone and only looping decoration is left,
     since a paused loop just sits on its first frame and still looks right. */
</style>

<defs>
  <pattern id="lf" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" class="gl" fill="none"/></pattern>
  <pattern id="lb" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" class="gm" fill="none"/></pattern>
</defs>
<rect class="paper" width="440" height="292" rx="6"/>
<rect width="440" height="292" fill="url(#lf)" rx="6"/>
<rect width="440" height="292" fill="url(#lb)" rx="6"/>
<line x1="34" y1="0" x2="34" y2="292" class="ml"/>
<rect x=".5" y=".5" width="439" height="291" rx="6" fill="none" class="rl"/>
<text x="46" y="34" class="mono ink" font-size="15" font-weight="700">what it is written in</text>
<path class="u" d="M46 42 H262"/>
<text x="358" y="34" class="mono pen" font-size="11">fig. 9</text>
<text x="46" y="58" class="mono pen" font-size="10">by bytes, across 53 repos</text>
<text x="46" y="88" class="mono ink2" font-size="12">c#</text>
<rect x="176" y="80" width="200" height="8" rx="4" fill="var(--major)" fill-opacity=".7"/>
<rect x="176" y="80" width="89.6" height="8" rx="4" fill="var(--accent)" fill-opacity=".9"><animate attributeName="width" from="0" to="89.6" dur=".9s" begin="0.30s" fill="freeze"/></rect>
<text x="394" y="88" text-anchor="end" class="mono pen" font-size="10.5">44.8%</text>
<text x="46" y="114" class="mono ink2" font-size="12">javascript</text>
<rect x="176" y="106" width="200" height="8" rx="4" fill="var(--major)" fill-opacity=".7"/>
<rect x="176" y="106" width="39.9" height="8" rx="4" fill="var(--accent)" fill-opacity=".9"><animate attributeName="width" from="0" to="39.9" dur=".9s" begin="0.40s" fill="freeze"/></rect>
<text x="394" y="114" text-anchor="end" class="mono pen" font-size="10.5">20.0%</text>
<text x="46" y="140" class="mono ink2" font-size="12">html</text>
<rect x="176" y="132" width="200" height="8" rx="4" fill="var(--major)" fill-opacity=".7"/>
<rect x="176" y="132" width="21.5" height="8" rx="4" fill="var(--accent)" fill-opacity=".9"><animate attributeName="width" from="0" to="21.5" dur=".9s" begin="0.50s" fill="freeze"/></rect>
<text x="394" y="140" text-anchor="end" class="mono pen" font-size="10.5">10.7%</text>
<text x="46" y="166" class="mono ink2" font-size="12">typescript</text>
<rect x="176" y="158" width="200" height="8" rx="4" fill="var(--major)" fill-opacity=".7"/>
<rect x="176" y="158" width="20.2" height="8" rx="4" fill="var(--accent)" fill-opacity=".9"><animate attributeName="width" from="0" to="20.2" dur=".9s" begin="0.60s" fill="freeze"/></rect>
<text x="394" y="166" text-anchor="end" class="mono pen" font-size="10.5">10.1%</text>
<text x="46" y="192" class="mono ink2" font-size="12">css</text>
<rect x="176" y="184" width="200" height="8" rx="4" fill="var(--major)" fill-opacity=".7"/>
<rect x="176" y="184" width="11.2" height="8" rx="4" fill="var(--accent)" fill-opacity=".9"><animate attributeName="width" from="0" to="11.2" dur=".9s" begin="0.70s" fill="freeze"/></rect>
<text x="394" y="192" text-anchor="end" class="mono pen" font-size="10.5">5.6%</text>
<text x="46" y="218" class="mono ink2" font-size="12">shaderlab</text>
<rect x="176" y="210" width="200" height="8" rx="4" fill="var(--major)" fill-opacity=".7"/>
<rect x="176" y="210" width="5.8" height="8" rx="4" fill="var(--accent)" fill-opacity=".9"><animate attributeName="width" from="0" to="5.8" dur=".9s" begin="0.80s" fill="freeze"/></rect>
<text x="394" y="218" text-anchor="end" class="mono pen" font-size="10.5">2.9%</text>
<text x="46" y="244" class="mono ink2" font-size="12">r</text>
<rect x="176" y="236" width="200" height="8" rx="4" fill="var(--major)" fill-opacity=".7"/>
<rect x="176" y="236" width="5.5" height="8" rx="4" fill="var(--accent)" fill-opacity=".9"><animate attributeName="width" from="0" to="5.5" dur=".9s" begin="0.90s" fill="freeze"/></rect>
<text x="394" y="244" text-anchor="end" class="mono pen" font-size="10.5">2.7%</text>
<text x="46" y="278" class="hand pen" font-size="11">measured 2026-09-12</text>
</svg>
