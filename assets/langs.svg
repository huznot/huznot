<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" width="440" height="260" role="img" aria-label="language distribution across public repositories">
<style>
  svg{--paper:#f7f5ed;--grid:#d8e2ec;--major:#c2d2e0;--ink:#173a5e;--ink2:#4a6076;--pencil:#8a99a8;--margin:#d98b8b;--accent:#c0562f}
  @media (prefers-color-scheme:dark){
    svg{--paper:#0a2239;--grid:#12385c;--major:#1b4a75;--ink:#eaf4ff;--ink2:#a9c9e2;--pencil:#6f92ac;--margin:#3f7fb0;--accent:#f0a868}
  }
  .paper{fill:var(--paper)}.gl{stroke:var(--grid);stroke-width:1}.gm{stroke:var(--major);stroke-width:1}
  .ml{stroke:var(--margin);stroke-width:1.3}
  .ink{fill:var(--ink)}.ink2{fill:var(--ink2)}.pen{fill:var(--pencil)}.acc{fill:var(--accent)}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Consolas,"Liberation Mono",Menlo,monospace}
  .hand{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive}
  @keyframes dr{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  .u{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:220;stroke-dashoffset:220;animation:dr 1s ease-out .2s forwards}
  .cell{opacity:0;animation:fade .5s ease-out forwards}
</style>

<defs>
  <pattern id="lf" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" class="gl" fill="none"/></pattern>
  <pattern id="lb" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" class="gm" fill="none"/></pattern>
</defs>
<rect class="paper" width="440" height="260"/>
<rect width="440" height="260" fill="url(#lf)"/><rect width="440" height="260" fill="url(#lb)"/>
<rect x="0" y="0" width="440" height="260" fill="none" class="gm" stroke-width="2"/>
<line x1="34" y1="0" x2="34" y2="260" class="ml"/>
<text x="46" y="34" class="mono ink" font-size="15" font-weight="700">what it is written in</text>
<path class="u" d="M46 42 H262"/>
<text x="356" y="34" class="mono pen" font-size="11">fig. 6</text>
<text x="46" y="56" class="mono pen" font-size="10">by bytes, public non-fork repos</text>
<text x="46" y="84" class="mono ink2" font-size="12">typescript</text>
<rect x="160" y="76" width="220" height="8" rx="4" fill="var(--major)" fill-opacity=".35"/>
<rect x="160" y="76" width="0" height="8" rx="4" fill="var(--accent)" fill-opacity=".85"><animate attributeName="width" from="0" to="77.6" dur=".9s" begin="0.30s" fill="freeze"/></rect>
<text x="390" y="84" class="mono pen" font-size="10.5">35.3%</text><text x="46" y="112" class="mono ink2" font-size="12">r</text>
<rect x="160" y="104" width="220" height="8" rx="4" fill="var(--major)" fill-opacity=".35"/>
<rect x="160" y="104" width="0" height="8" rx="4" fill="var(--accent)" fill-opacity=".85"><animate attributeName="width" from="0" to="44.1" dur=".9s" begin="0.42s" fill="freeze"/></rect>
<text x="390" y="112" class="mono pen" font-size="10.5">20.0%</text><text x="46" y="140" class="mono ink2" font-size="12">html</text>
<rect x="160" y="132" width="220" height="8" rx="4" fill="var(--major)" fill-opacity=".35"/>
<rect x="160" y="132" width="0" height="8" rx="4" fill="var(--accent)" fill-opacity=".85"><animate attributeName="width" from="0" to="39.9" dur=".9s" begin="0.54s" fill="freeze"/></rect>
<text x="390" y="140" class="mono pen" font-size="10.5">18.1%</text><text x="46" y="168" class="mono ink2" font-size="12">javascript</text>
<rect x="160" y="160" width="220" height="8" rx="4" fill="var(--major)" fill-opacity=".35"/>
<rect x="160" y="160" width="0" height="8" rx="4" fill="var(--accent)" fill-opacity=".85"><animate attributeName="width" from="0" to="35.8" dur=".9s" begin="0.66s" fill="freeze"/></rect>
<text x="390" y="168" class="mono pen" font-size="10.5">16.3%</text><text x="46" y="196" class="mono ink2" font-size="12">css</text>
<rect x="160" y="188" width="220" height="8" rx="4" fill="var(--major)" fill-opacity=".35"/>
<rect x="160" y="188" width="0" height="8" rx="4" fill="var(--accent)" fill-opacity=".85"><animate attributeName="width" from="0" to="13.3" dur=".9s" begin="0.78s" fill="freeze"/></rect>
<text x="390" y="196" class="mono pen" font-size="10.5">6.1%</text><text x="46" y="224" class="mono ink2" font-size="12">php</text>
<rect x="160" y="216" width="220" height="8" rx="4" fill="var(--major)" fill-opacity=".35"/>
<rect x="160" y="216" width="0" height="8" rx="4" fill="var(--accent)" fill-opacity=".85"><animate attributeName="width" from="0" to="4.1" dur=".9s" begin="0.90s" fill="freeze"/></rect>
<text x="390" y="224" class="mono pen" font-size="10.5">1.9%</text>
<text x="46" y="246" class="hand pen" font-size="11">measured 2026-09-02</text>
</svg>
