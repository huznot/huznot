<rect x="176" y="158" width="7.8" height="8" rx="4" fill="var(--accent)" fill-opacity=".9"><animate attributeName="width" from="0" to="7.8" dur=".9s" begin="0.60s" fill="freeze"/></rect>
<text x="394" y="166" text-anchor="end" class="mono pen" font-size="10.5">3.9%</text>
<text x="46" y="192" class="mono ink2" font-size="12">javascript</text>
<rect x="176" y="184" width="200" height="8" rx="4" fill="var(--major)" fill-opacity=".7"/>
<rect x="176" y="184" width="7.5" height="8" rx="4" fill="var(--accent)" fill-opacity=".9"><animate attributeName="width" from="0" to="7.5" dur=".9s" begin="0.70s" fill="freeze"/></rect>
<text x="394" y="192" text-anchor="end" class="mono pen" font-size="10.5">3.7%</text>
<text x="46" y="218" class="mono ink2" font-size="12">html</text>
<rect x="176" y="210" width="200" height="8" rx="4" fill="var(--major)" fill-opacity=".7"/>
<rect x="176" y="210" width="7.2" height="8" rx="4" fill="var(--accent)" fill-opacity=".9"><animate attributeName="width" from="0" to="7.2" dur=".9s" begin="0.80s" fill="freeze"/></rect>
<text x="394" y="218" text-anchor="end" class="mono pen" font-size="10.5">3.6%</text>
<text x="46" y="244" class="mono ink2" font-size="12">css</text>
<rect x="176" y="236" width="200" height="8" rx="4" fill="var(--major)" fill-opacity=".7"/>
<rect x="176" y="236" width="3.0" height="8" rx="4" fill="var(--accent)" fill-opacity=".9"><animate attributeName="width" from="0" to="3.0" dur=".9s" begin="0.90s" fill="freeze"/></rect>
<text x="394" y="244" text-anchor="end" class="mono pen" font-size="10.5">1.2%</text>
<text x="46" y="278" class="hand pen" font-size="11">measured 2026-09-04</text>
</svg>
