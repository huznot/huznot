name: regenerate profile plates

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # PROFILE_TOKEN is a personal access token with the `repo` scope. it is what
      # lets the language plate see private repositories. without it the workflow
      # still runs, it just counts public ones.
      - name: redraw the data plates
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/generate-stats.mjs

      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib.svg assets/langs.svg assets/streak.svg assets/totals.svg
          git add assets/dark/contrib.svg assets/dark/langs.svg assets/dark/streak.svg assets/dark/totals.svg
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: regenerate profile plates"
            git push
          fi
